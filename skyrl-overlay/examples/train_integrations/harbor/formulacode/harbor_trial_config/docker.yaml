# @package harbor_trial_config
#
# FormulaCode Harbor config for Docker environment + terminus-2 with XML parser.
# XML parser = terminus's own <response><commands><keystrokes>...</keystrokes>
# format, parsed from raw LLM text. No vLLM tool_call_parser or
# enable_auto_tool_choice needed.
#
# SkyRL injects at runtime:
#   - task.path
#   - agent.model_name  (hosted_vllm/<served_model_name>)
#   - agent.kwargs.api_base
#   - agent.kwargs.session_id

trials_dir: /mnt/sdd3/asharma/formulacode-rlvr/results/trials

timeout_multiplier: 1.0

agent:
  name: terminus-2

  # 1 hour per trial — enough for profile → patch → ASV benchmark cycle
  override_timeout_sec: 3600

  kwargs:
    # Use XML text-based parsing; no OpenAI tool-calling or qwen3_xml parser needed
    parser_name: xml

    # Qwen3 produces <think>...</think> tokens; preserve them across turns
    interleaved_thinking: true

    max_turns: 32

    suppress_max_turns_warning: true

    # Must be false for step-wise training
    enable_summarize: false

    # Required for SkyRL step-wise rollout collection
    collect_rollout_details: true

    temperature: 1.0

    # max_input_tokens MUST match MAX_MODEL_LEN in the training script
    model_info:
      max_input_tokens: 131072
      max_output_tokens: 8192
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

    llm_kwargs:
      timeout: 900
      max_retries: 0
      top_p: 1.0
      top_k: -1
      min_p: 0.0

environment:
  type: docker

  # Match task.toml resource spec
  override_cpus: 3
  override_memory_mb: 16384
  override_storage_mb: 10240
  suppress_override_warnings: true

  # No kwargs block — removes daytona-specific auto_stop_interval_mins

verifier:
  disable: false
